<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Favicon matching Google's -->
    <link
      rel="icon"
      href="https://www.google.com/favicon.ico"
      type="image/x-icon"
    />
  </head>
  <body>
    <!-- ── Header ─────────────────────────────────────────── -->
    <header>
      <div class="header-right">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <!-- Google Apps grid icon (SVG) -->
        <a href="#" title="Google apps" aria-label="Google apps">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="#5f6368"
          >
            <path d="M6 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" />
          </svg>
        </a>
        <a class="sign-in-btn" href="#">Sign in</a>
      </div>
    </header>

    <!-- ── Main ──────────────────────────────────────────── -->
    <main>
      <!-- Logo (SVG-based, matches Google's colour scheme) -->
      <div class="logo" aria-label="Google">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 272 92"
          width="272"
          height="92"
          aria-hidden="true"
        >
          <!-- G -->
          <path
            fill="#4285F4"
            d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"
          />
          <!-- o -->
          <path
            fill="#EA4335"
            d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"
          />
          <!-- o (third letter) -->
          <path
            fill="#FBBC05"
            d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.67-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.62h9.26zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z"
          />
          <!-- g -->
          <path
            fill="#4285F4"
            d="M225 3v65h-9.5V3h9.5z"
          />
          <!-- l -->
          <path
            fill="#34A853"
            d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z"
          />
          <!-- e -->
          <path
            fill="#EA4335"
            d="M35.29 41.41V32h34.2c.34 1.76.51 3.85.51 6.11 0 7.59-2.07 16.98-8.74 23.65-6.5 6.75-14.82 10.34-25.85 10.34C16.08 72.1.5 57.02.5 37.5.5 17.98 16.08 2.9 35.41 2.9c11.28 0 19.33 4.41 25.36 10.19l-7.14 7.14c-4.33-4.07-10.2-7.23-18.22-7.23-14.9 0-26.52 12.01-26.52 26.5s11.62 26.5 26.52 26.5c9.66 0 15.16-3.87 18.68-7.39 2.87-2.87 4.74-6.97 5.49-12.58l-24.29.38z"
          />
        </svg>
      </div>

      <!-- Search bar -->
      <div class="search-wrapper">
        <div class="search-box">
          <!-- Search icon -->
          <svg
            class="search-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
            />
          </svg>

          <input
            class="search-input"
            type="text"
            aria-label="Search"
            autocomplete="off"
          />

          <!-- Microphone icon -->
          <svg
            class="mic-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            aria-label="Search by voice"
          >
            <path
              fill="#4285f4"
              d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3z"
            />
            <path
              fill="#34a853"
              d="M17 12c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"
            />
          </svg>
        </div>

        <!-- Buttons -->
        <div class="search-buttons">
          <button type="button">Google Search</button>
          <button type="button">I'm Feeling Lucky</button>
        </div>
      </div>
    </main>

    <!-- ── Footer ─────────────────────────────────────────── -->
    <footer>
      <!-- Country name shown by Google based on user location; replace as needed -->
      <div class="footer-top">India</div>
      <div class="footer-bottom">
        <ul class="footer-links">
          <li><a href="#">Advertising</a></li>
          <li><a href="#">Business</a></li>
          <li><a href="#">How Search works</a></li>
        </ul>
        <ul class="footer-links">
          <li><a href="#">Privacy</a></li>
          <li><a href="#">Terms</a></li>
          <li><a href="#">Settings</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
